<!doctype html>
<html lang="id" class="h-full antialiased" data-overlayscrollbars-initialize>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <script>
      // Mode gelap dipasang sebelum halaman tampil supaya tidak berkedip terang (lihat src/client/theme.ts).
      try {
        if (localStorage.getItem("jimpitan:theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#0b1220";
        }
      } catch {}
    </script>
    <meta name="description" content="Dashboard pengurus jimpitan." />
    <!-- Logo lingkungan kalau ada, selain itu /icon.svg (lihat src/server/routes/logo.ts). -->
    <link rel="icon" href="/api/logo/favicon" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="manifest" href="/admin.webmanifest" />
    <meta name="robots" content="noindex" />
    <title>Jimpitan · Admin</title>
  </head>
  <body class="flex min-h-full flex-col font-sans" data-overlayscrollbars-initialize>
    <div id="root" class="flex min-h-full flex-1 flex-col"></div>
    <script type="module" src="/src/apps/admin/main.tsx"></script>
  </body>
</html>
